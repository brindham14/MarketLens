name: Update stock data
on:
  schedule:
    - cron: "30 11 * * 1-5"   # 17:00 IST, Mon-Fri (after market close)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install yfinance pandas numpy
      - run: python update_data.py
      - run: |
          git config user.name "data-bot"; git config user.email "bot@users.noreply.github.com"
          git add data; git commit -m "Update data $(date -u +%F)" || exit 0; git push
